# fly.toml app configuration file generated for pgpe-engine-poc on 2026-05-25T11:01:28-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pgpe-engine-poc'
primary_region = 'iad'

[build]
  dockerfile = 'docker/Dockerfile'

[env]
  PGMQ_PLACEHOLDER_QUEUE = 'q_placeholder'
  PORT = '8080'
  WORKER_POLL_SECONDS = '30'

[processes]
  http = 'http'
  worker = 'worker'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['http']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['http', 'worker']
