name: engine-ci

# Runs the engine test suite on every PR targeting main and on every
# push to main. Surfaces a green/red signal on PRs; nothing in this
# workflow deploys anything.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same PR / branch when a new commit lands.
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run engine tests
        run: gradle :engine:test --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports
          path: engine/build/reports/tests/test
          retention-days: 7
